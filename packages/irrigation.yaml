# -----------------------------------------------------------------------------
# TEMPLATE SENSORS
# -----------------------------------------------------------------------------
template:
  - sensor:
      # ---------- Zone 1 ----------
      - name: Irrigation Zone 1 Flow
        unique_id: irrigation_zone_1_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_1_enabled','on')
                and is_state('switch.irrigation_zone_1','on') %}
            {{ states('input_number.irrigation_zone_1_rate') | float(0) }}
          {% else %}0{% endif %}

      - name: Irrigation Zone 1 Name
        unique_id: irrigation_zone_1_name
        state: >-
          {{ state_attr('switch.irrigation_zone_1','friendly_name') or 'Zone 1' }}

      - name: Irrigation Zone 1 Remaining
        unique_id: irrigation_zone_1_remaining
        unit_of_measurement: min
        state: >-
          {% set s = states.switch.irrigation_zone_1 %}
          {% if s is not none and s.state == 'on' %}
            {% set ziel = states('input_number.irrigation_zone_1_last_duration') | float(0) %}
            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}
      # ---------- Zone 2 ----------
      - name: Irrigation Zone 2 Flow
        unique_id: irrigation_zone_2_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_2_enabled','on')
                and is_state('switch.irrigation_zone_2','on') %}
            {{ states('input_number.irrigation_zone_2_rate') | float(0) }}
          {% else %}0{% endif %}

