input_text:
  irrigation_weather:
    name: Weather entity
    icon: mdi:weather-partly-rainy
    max: 255
  # Compact weekly plan for the display card, for example
  #   Mon:1,3|Tue:2,3|Wed:1,3|Thu:3|Fri:1,3|Sat:2,3|Sun:1,3
  # Numbers are zone slots. Presentation only - the real schedule lives in the
  # blueprints and has to match.
  irrigation_schedule:
    name: Weekly plan
    icon: mdi:calendar-week
    max: 255

input_datetime:
  irrigation_counter_start:
    name: Counting since
    icon: mdi:calendar-start
    has_date: true
    has_time: false

# -----------------------------------------------------------------------------
# RIEMANN INTEGRATION  (L/h -> L, counts up, never reset)
# -----------------------------------------------------------------------------
sensor:
  - platform: integration
    name: Irrigation Zone 1 Total
    unique_id: irrigation_zone_1_total
    source: sensor.irrigation_zone_1_flow
    method: left
    unit_time: h
    round: 1
    max_sub_interval:
      minutes: 1
  - platform: integration
    name: Irrigation Zone 2 Total
    unique_id: irrigation_zone_2_total
    source: sensor.irrigation_zone_2_flow
    method: left
    unit_time: h
    round: 1
    max_sub_interval:
      minutes: 1
  - platform: integration
    name: Irrigation Zone 3 Total
    unique_id: irrigation_zone_3_total
    source: sensor.irrigation_zone_3_flow
    method: left
    unit_time: h
    round: 1
