            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}
      # ---------- Zone 3 ----------
      - name: Irrigation Zone 3 Flow
        unique_id: irrigation_zone_3_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_3_enabled','on')
                and is_state('switch.irrigation_zone_3','on') %}
            {{ states('input_number.irrigation_zone_3_rate') | float(0) }}
          {% else %}0{% endif %}

      - name: Irrigation Zone 3 Name
        unique_id: irrigation_zone_3_name
        state: >-
          {{ state_attr('switch.irrigation_zone_3','friendly_name') or 'Zone 3' }}

      - name: Irrigation Zone 3 Remaining
        unique_id: irrigation_zone_3_remaining
        unit_of_measurement: min
        state: >-
          {% set s = states.switch.irrigation_zone_3 %}
          {% if s is not none and s.state == 'on' %}
            {% set ziel = states('input_number.irrigation_zone_3_last_duration') | float(0) %}
            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}
      # ---------- Zone 4 ----------
      - name: Irrigation Zone 4 Flow
        unique_id: irrigation_zone_4_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_4_enabled','on')
                and is_state('switch.irrigation_zone_4','on') %}
            {{ states('input_number.irrigation_zone_4_rate') | float(0) }}
          {% else %}0{% endif %}

      - name: Irrigation Zone 4 Name
        unique_id: irrigation_zone_4_name
        state: >-
          {{ state_attr('switch.irrigation_zone_4','friendly_name') or 'Zone 4' }}

      - name: Irrigation Zone 4 Remaining
        unique_id: irrigation_zone_4_remaining
        unit_of_measurement: min
        state: >-
          {% set s = states.switch.irrigation_zone_4 %}
          {% if s is not none and s.state == 'on' %}
            {% set ziel = states('input_number.irrigation_zone_4_last_duration') | float(0) %}
            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}
      # ---------- Zone 5 ----------
      - name: Irrigation Zone 5 Flow
        unique_id: irrigation_zone_5_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_5_enabled','on')
                and is_state('switch.irrigation_zone_5','on') %}
            {{ states('input_number.irrigation_zone_5_rate') | float(0) }}
          {% else %}0{% endif %}

      - name: Irrigation Zone 5 Name
        unique_id: irrigation_zone_5_name
        state: >-
          {{ state_attr('switch.irrigation_zone_5','friendly_name') or 'Zone 5' }}

      - name: Irrigation Zone 5 Remaining
        unique_id: irrigation_zone_5_remaining
        unit_of_measurement: min
        state: >-
          {% set s = states.switch.irrigation_zone_5 %}
          {% if s is not none and s.state == 'on' %}
            {% set ziel = states('input_number.irrigation_zone_5_last_duration') | float(0) %}
            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}
      # ---------- Zone 6 ----------
      - name: Irrigation Zone 6 Flow
        unique_id: irrigation_zone_6_flow
        unit_of_measurement: L/h
        state_class: measurement
        state: >-
          {% if is_state('input_boolean.irrigation_zone_6_enabled','on')
                and is_state('switch.irrigation_zone_6','on') %}
            {{ states('input_number.irrigation_zone_6_rate') | float(0) }}
          {% else %}0{% endif %}

      - name: Irrigation Zone 6 Name
        unique_id: irrigation_zone_6_name
        state: >-
          {{ state_attr('switch.irrigation_zone_6','friendly_name') or 'Zone 6' }}

      - name: Irrigation Zone 6 Remaining
        unique_id: irrigation_zone_6_remaining
        unit_of_measurement: min
        state: >-
          {% set s = states.switch.irrigation_zone_6 %}
          {% if s is not none and s.state == 'on' %}
            {% set ziel = states('input_number.irrigation_zone_6_last_duration') | float(0) %}
            {% set lief = (now() - s.last_changed).total_seconds() / 60 %}
            {{ [ziel - lief, 0] | max | round(0) }}
          {% else %}0{% endif %}

      # ---------- Totals ----------
      - name: Irrigation Water Today
        unique_id: irrigation_water_today
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:water-outline
        state: >-
          {{ ( 0 + states('sensor.irrigation_zone_1_today') | float(0) + states('sensor.irrigation_zone_2_today') | float(0) + states('sensor.irrigation_zone_3_today') | float(0) + states('sensor.irrigation_zone_4_today') | float(0) + states('sensor.irrigation_zone_5_today') | float(0) + states('sensor.irrigation_zone_6_today') | float(0) ) | round(0) }}
      - name: Irrigation Water Week
        unique_id: irrigation_water_week
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:water-outline
        state: >-
          {{ ( 0 + states('sensor.irrigation_zone_1_week') | float(0) + states('sensor.irrigation_zone_2_week') | float(0) + states('sensor.irrigation_zone_3_week') | float(0) + states('sensor.irrigation_zone_4_week') | float(0) + states('sensor.irrigation_zone_5_week') | float(0) + states('sensor.irrigation_zone_6_week') | float(0) ) | round(0) }}
      - name: Irrigation Water Month
        unique_id: irrigation_water_month
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:water-outline
        state: >-
          {{ ( 0 + states('sensor.irrigation_zone_1_month') | float(0) + states('sensor.irrigation_zone_2_month') | float(0) + states('sensor.irrigation_zone_3_month') | float(0) + states('sensor.irrigation_zone_4_month') | float(0) + states('sensor.irrigation_zone_5_month') | float(0) + states('sensor.irrigation_zone_6_month') | float(0) ) | round(0) }}
      - name: Irrigation Water Since
        unique_id: irrigation_water_since
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:water-outline
        state: >-
          {{ ( 0 + states('sensor.irrigation_zone_1_since') | float(0) + states('sensor.irrigation_zone_2_since') | float(0) + states('sensor.irrigation_zone_3_since') | float(0) + states('sensor.irrigation_zone_4_since') | float(0) + states('sensor.irrigation_zone_5_since') | float(0) + states('sensor.irrigation_zone_6_since') | float(0) ) | round(0) }}

      # ---------- Global status ----------
      - name: Irrigation Flow
        unique_id: irrigation_flow
        unit_of_measurement: L/h
        state_class: measurement
        icon: mdi:water-pump
        state: "{{ ( 0 + states('sensor.irrigation_zone_1_flow') | float(0) + states('sensor.irrigation_zone_2_flow') | float(0) + states('sensor.irrigation_zone_3_flow') | float(0) + states('sensor.irrigation_zone_4_flow') | float(0) + states('sensor.irrigation_zone_5_flow') | float(0) + states('sensor.irrigation_zone_6_flow') | float(0) ) | round(0) }}"

      - name: Irrigation Remaining
        unique_id: irrigation_remaining
        unit_of_measurement: min
        state: "{{ [ states('sensor.irrigation_zone_1_remaining') | float(0), states('sensor.irrigation_zone_2_remaining') | float(0), states('sensor.irrigation_zone_3_remaining') | float(0), states('sensor.irrigation_zone_4_remaining') | float(0), states('sensor.irrigation_zone_5_remaining') | float(0), states('sensor.irrigation_zone_6_remaining') | float(0) ] | max | round(0) }}"

      - name: Irrigation Active Zones
        unique_id: irrigation_active_zones
        icon: mdi:sprinkler-variant
        state: >-
          {% set ns = namespace(l=[]) %}
          {% for i in range(1, 7) %}
            {% if is_state('switch.irrigation_zone_' ~ i, 'on') %}
              {% set ns.l = ns.l + [ states('sensor.irrigation_zone_' ~ i ~ '_name') ] %}
            {% endif %}
          {% endfor %}
          {{ ns.l | join(' + ') if ns.l else 'Ready' }}

      - name: Irrigation Daily Average
        unique_id: irrigation_daily_average
        unit_of_measurement: L
        state: >-
          {% set tage = now().weekday() %}
          {% if tage < 1 %}unknown{% else %}
          {{ (( states('sensor.irrigation_water_week') | float(0)
              - states('sensor.irrigation_water_today') | float(0) ) / tage) | round(0) }}
          {% endif %}

      - name: Irrigation Average Since
        unique_id: irrigation_average_since
        unit_of_measurement: L
        state: >-
          {% set ts = state_attr('input_datetime.irrigation_counter_start','timestamp') %}
          {% if ts is none %}unknown{% else %}
          {% set tage = [ ((now().timestamp() - ts) / 86400) | round(0) | int, 1 ] | max %}
          {{ (states('sensor.irrigation_water_since') | float(0) / tage) | round(0) }}
          {% endif %}

      - name: Irrigation Counter Start
        unique_id: irrigation_counter_start_text
        icon: mdi:calendar-start
        state: >-
          {% set ts = state_attr('input_datetime.irrigation_counter_start','timestamp') %}
          {{ ts | timestamp_custom('%d.%m.%Y', true) if ts else 'not set' }}

      - name: Irrigation Next Run
        unique_id: irrigation_next_run
        icon: mdi:clock-outline
        state: >-
          {% set r0 = states('sensor.irrigation_rain_today') | float(0) %}
          {% set r1 = states('sensor.irrigation_rain_tomorrow') | float(0) %}
          {% set r2 = states('sensor.irrigation_rain_day_after') | float(0) %}
          {% if not is_state('input_boolean.irrigation_enabled','on') %}
            Irrigation switched off
          {% elif now().hour < 5 %}
            {{ 'Today 05:00 - rain skip likely, ' ~ (r0 + r1) | round(1) ~ ' mm'
                if (r0 + r1) >= 6 else 'Today 05:00' }}
          {% else %}
            {{ 'Tomorrow 05:00 - rain skip likely, ' ~ (r1 + r2) | round(1) ~ ' mm'
                if (r1 + r2) >= 6 else 'Tomorrow 05:00' }}
          {% endif %}

  - binary_sensor:
      - name: Irrigation Running
        unique_id: irrigation_is_running
        device_class: running
        state: "{{ is_state('switch.irrigation_zone_1','on') or is_state('switch.irrigation_zone_2','on') or is_state('switch.irrigation_zone_3','on') or is_state('switch.irrigation_zone_4','on') or is_state('switch.irrigation_zone_5','on') or is_state('switch.irrigation_zone_6','on') }}"

  # ---------------------------------------------------------------------------
  # RUN LOG AND FAULTS
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: state
        id: run
        entity_id:
          - switch.irrigation_zone_1
          - switch.irrigation_zone_2
          - switch.irrigation_zone_3
          - switch.irrigation_zone_4
          - switch.irrigation_zone_5
          - switch.irrigation_zone_6
        from: "on"
        to: "off"
      - trigger: state
        id: offline
        entity_id:
          - switch.irrigation_zone_1
          - switch.irrigation_zone_2
          - switch.irrigation_zone_3
          - switch.irrigation_zone_4
          - switch.irrigation_zone_5
          - switch.irrigation_zone_6
        to:
          - unavailable
          - unknown
        for:
          minutes: 1
      - trigger: state
        id: online
        entity_id:
          - switch.irrigation_zone_1
          - switch.irrigation_zone_2
          - switch.irrigation_zone_3
          - switch.irrigation_zone_4
          - switch.irrigation_zone_5
          - switch.irrigation_zone_6
        from:
          - unavailable
          - unknown
        to:
          - "on"
          - "off"
        for:
          seconds: 30
      - trigger: event
        id: fault
        event_type: irrigation_fault
    sensor:
      - name: Irrigation Log
        unique_id: irrigation_log
        icon: mdi:history
        state: >-
          {% if trigger.id == 'fault' %}{{ trigger.event.data.zone }} -
          {{ trigger.event.data.text }}{% else %}{{
          state_attr(trigger.entity_id,'friendly_name') or trigger.entity_id }} -
          {{ now() | as_local | as_timestamp | timestamp_custom('%d.%m. %H:%M') }}{% endif %}
        attributes:
          entries: >-
            {% set raw = this.attributes.get('entries', []) %}
            {% set old = raw if (raw is sequence and raw is not string) else [] %}
            {% set now_txt = now() | as_local | as_timestamp
                            | timestamp_custom('%d.%m. %H:%M') %}
            {% if trigger.id == 'run' %}
              {% set slot = trigger.entity_id.split('_')[-1] %}
              {% set rate = states('input_number.irrigation_zone_' ~ slot ~ '_rate') | float(0) %}
              {% set sec = (trigger.to_state.last_changed
                          - trigger.from_state.last_changed).total_seconds() %}
              {% if sec >= 10 %}
                {% set e = {'kind':'run',
                     'zone': states('sensor.irrigation_zone_' ~ slot ~ '_name'),
                     'slot': slot | int,
                     'start': trigger.from_state.last_changed | as_local
                              | as_timestamp | timestamp_custom('%d.%m. %H:%M'),
                     'sec': sec | round(0) | int,
                     'liters': (sec / 3600 * rate) | round(1),
                     'text': ''} %}
                {{ ([e] + old)[:25] }}
              {% else %}{{ old }}{% endif %}
            {% elif trigger.id in ['offline','online'] %}
              {% set slot = trigger.entity_id.split('_')[-1] %}
              {% set e = {'kind': 'fault' if trigger.id == 'offline' else 'info',
                   'zone': states('sensor.irrigation_zone_' ~ slot ~ '_name'),
                   'slot': slot | int, 'start': now_txt, 'sec': 0, 'liters': 0,
                   'text': 'Device unreachable' if trigger.id == 'offline'
                           else 'back online'} %}
              {{ ([e] + old)[:25] }}
            {% elif trigger.id == 'fault' %}
              {% set e = {'kind':'fault', 'zone': trigger.event.data.zone,
                   'slot': 0, 'start': now_txt, 'sec': 0, 'liters': 0,
                   'text': trigger.event.data.text} %}
              {{ ([e] + old)[:25] }}
            {% else %}{{ old }}{% endif %}

  # ---------------------------------------------------------------------------
  # RAIN FORECAST
  # The weather entity comes from an input_text, which only works because
  # weather.get_forecasts is called from an action where targets may be
  # templated.
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ has_value('input_text.irrigation_weather') }}"
    action:
      - action: weather.get_forecasts
        target:
          entity_id: "{{ states('input_text.irrigation_weather') }}"
        data:
          type: daily
        response_variable: fc
    sensor:
      - name: Irrigation Rain Today
        unique_id: irrigation_rain_today
        unit_of_measurement: mm
        state: >-
          {% set f = (fc.values() | list | first).forecast %}
          {{ (f[0].precipitation | float(0)) | round(1) if f | length > 0 else 0 }}
      - name: Irrigation Rain Tomorrow
        unique_id: irrigation_rain_tomorrow
        unit_of_measurement: mm
        state: >-
          {% set f = (fc.values() | list | first).forecast %}
          {{ (f[1].precipitation | float(0)) | round(1) if f | length > 1 else 0 }}
      - name: Irrigation Rain Day After
        unique_id: irrigation_rain_day_after
        unit_of_measurement: mm
        state: >-
          {% set f = (fc.values() | list | first).forecast %}
          {{ (f[2].precipitation | float(0)) | round(1) if f | length > 2 else 0 }}

# -----------------------------------------------------------------------------
# SCRIPTS
# -----------------------------------------------------------------------------
script:
  irrigation_zone_1_run:
    alias: Irrigation zone 1 manual run
    icon: mdi:play
    mode: restart
    variables:
      minutes: "{{ states('input_number.irrigation_zone_1_duration') | int(10) }}"
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.irrigation_running
            state: "on"
        then:
          - event: irrigation_fault
            event_data:
              zone: "{{ states('sensor.irrigation_zone_1_name') }}"
              text: Manual start rejected, a cycle is running
          - stop: Cycle running
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigation_zone_1_last_duration
        data:
          value: "{{ minutes }}"
      - action: switch.turn_on
        target:
          entity_id: switch.irrigation_zone_1
      - wait_template: "{{ is_state('switch.irrigation_zone_1','on') }}"
        timeout:
          seconds: 90
        continue_on_timeout: true
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: switch.irrigation_zone_1
                state: "on"
        then:
          - event: irrigation_fault
            event_data:
              zone: "{{ states('sensor.irrigation_zone_1_name') }}"
              text: Valve did not confirm the start
          - stop: Start not confirmed
      - delay:
          minutes: "{{ minutes }}"
      - action: switch.turn_off
        target:
          entity_id: switch.irrigation_zone_1

  irrigation_zone_1_toggle:
    alias: Irrigation zone 1 start/stop
    icon: mdi:play-pause
    mode: restart
    sequence:
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: switch.irrigation_zone_1
                state: "on"
              - condition: state
                entity_id: script.irrigation_zone_1_run
                state: "on"
        then:
          - action: script.turn_off
            target:
              entity_id: script.irrigation_zone_1_run
          - action: switch.turn_off
            target:
              entity_id: switch.irrigation_zone_1
