# =============================================================================
#  IRRIGATION - Home Assistant package        6 zone slots
#  Place at /config/packages/irrigation.yaml
#
#  NOTHING IN THIS FILE NEEDS EDITING.
#  Rename your valve entities to switch.irrigation_zone_1 ... _6 and set
#  everything else from the dashboard: flow rate, run time, which zones exist,
#  weather entity, weekly schedule.
#
#  Why the naming convention is unavoidable: the integration and utility_meter
#  platforms resolve "source" at configuration time, so the entity id has to be
#  literal. A template is not allowed there. Renaming four entities in the UI is
#  the cheaper end of that trade.
#
#  Need more slots? Regenerate: python3 tools/generate.py --zones 10
# =============================================================================

input_boolean:
  irrigation_enabled:
    name: Irrigation enabled
    icon: mdi:power
  # Set by the blueprints while a cycle runs. Blocks manual starts and needs no
  # automation entity id anywhere, so renaming an automation cannot break it.
  irrigation_running:
    name: Irrigation cycle running
    icon: mdi:robot
  irrigation_zone_1_enabled:
    name: Zone 1 in use
    icon: mdi:valve
  irrigation_zone_2_enabled:
    name: Zone 2 in use
    icon: mdi:valve
  irrigation_zone_3_enabled:
    name: Zone 3 in use
    icon: mdi:valve
  irrigation_zone_4_enabled:
    name: Zone 4 in use
    icon: mdi:valve
  irrigation_zone_5_enabled:
    name: Zone 5 in use
    icon: mdi:valve
  irrigation_zone_6_enabled:
    name: Zone 6 in use
    icon: mdi:valve

input_number:
  irrigation_zone_1_rate:
    name: Zone 1 flow rate
    icon: mdi:water-pump
    min: 1
    max: 3000
    step: 1
    unit_of_measurement: L/h
    mode: box
  irrigation_zone_1_duration:
    name: Zone 1 run time
    icon: mdi:timer-outline
    min: 1
    max: 120
    step: 1
    unit_of_measurement: min
  # Written by the run script and by the blueprint. Only used to work out the
  # remaining time, never shown as a control.
  irrigation_zone_1_last_duration:
    name: Zone 1 active run time
    icon: mdi:timer-sand
    min: 0
    max: 240
    step: 1
    unit_of_measurement: min
  irrigation_zone_2_rate:
