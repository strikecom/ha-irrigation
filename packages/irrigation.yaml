      minutes: 1
  - platform: integration
    name: Irrigation Zone 5 Total
    unique_id: irrigation_zone_5_total
    source: sensor.irrigation_zone_5_flow
    method: left
    unit_time: h
    round: 1
    max_sub_interval:
      minutes: 1
  - platform: integration
    name: Irrigation Zone 6 Total
